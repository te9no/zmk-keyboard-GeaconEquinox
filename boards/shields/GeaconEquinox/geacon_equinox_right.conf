CONFIG_ZMK_POINTING=y
CONFIG_ZMK_ANIMATION=y
CONFIG_SPI=y
CONFIG_ZMK_DRIVER_EXT_POWER_TRANSIENT=y
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_INTERVAL_MS=250
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=50
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_CHANGE=y
CONFIG_RGBLED_WIDGET_LAYER_COLOR=7
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
# Input callbacks also send split relay events for Studio diagnostics.
# The default 1024-byte input stack overflowed in zmk_split_bt_send_relay_event.
CONFIG_INPUT_THREAD_STACK_SIZE=4096
CONFIG_GPIO_HOGS=y
CONFIG_ZMK_USB=n
CONFIG_PMW3610=y
CONFIG_EQUINOX_PMW_DIAGNOSTICS=y
CONFIG_LOG_PRINTK=n
CONFIG_PMW3610_REPORT_INTERVAL_MIN=16
CONFIG_PMW3610_LOG_LEVEL_DBG=y
# The controller intentionally bounds its initial transfer trace.
CONFIG_SPI_THREE_WIRE_GPIO_LOG_LEVEL_DBG=y
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_SPLIT_RELAY=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_PMW3610_SPLIT_RPC_RELAY=y
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=256
