CONFIG_ZMK_NEMU_LINK=y
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_POINTING=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_USB=y
CONFIG_ZMK_SLEEP=n
CONFIG_SENSOR=y
CONFIG_ZMK_HIRES_DIAL=y
CONFIG_ZMK_HIRES_DIAL_SCROLL=y
CONFIG_ZMK_HIRES_DIAL_RADIAL_CONTROLLER=y
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
# Local Studio/Dynamic Settings only. Both keyboards are split peripherals,
# not peer Studio endpoints; do not initiate keymap synchronization to them.
CONFIG_ZMK_NEMU_LINK_STUDIO_ENDPOINT=n
CONFIG_ZMK_DYNAMIC_SETTINGS=y
CONFIG_ZMK_DYNAMIC_INPUT_PROCESSOR=y
CONFIG_SETTINGS_NVS=y

CONFIG_ZMK_DYNAMIC_COMBO=y
CONFIG_ZMK_DYNAMIC_COMBO_MAX_SLOTS=4
CONFIG_ZMK_DYNAMIC_ENCODER_RUNTIME=y
CONFIG_ZMK_DYNAMIC_MACRO=y
CONFIG_ZMK_DYNAMIC_MACRO_MAX_SLOTS=4
CONFIG_ZMK_DYNAMIC_TAP_DANCE=y
CONFIG_ZMK_DYNAMIC_TAP_DANCE_MAX_SLOTS=4
CONFIG_NEMU_LINK_FULL_SCAN=y
# This receiver uses nemu-link and USB, not BLE host profiles.
CONFIG_ZMK_DYNAMIC_BLE_PROFILE=n
