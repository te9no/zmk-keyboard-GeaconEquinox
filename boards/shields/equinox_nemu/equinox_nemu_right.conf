CONFIG_ZMK_NEMU_LINK=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_SPLIT_BLE=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_ZMK_USB=n
CONFIG_GPIO_HOGS=y
CONFIG_ZMK_NEMU_LINK_PERIPHERAL_ID=1
CONFIG_SPI=y
CONFIG_PMW3610=y
CONFIG_PMW3610_REPORT_INTERVAL_MIN=16
CONFIG_USB_DEVICE_STACK=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

CONFIG_BT_LL_SW_SPLIT=y
CONFIG_ZMK_NEMU_LINK_MODE_SWITCH=y
CONFIG_ZMK_NEMU_LINK_BOOT_ESB=y
CONFIG_ZMK_NEMU_LINK_MODE_CHORD=y

# The input callback synchronously encodes/encrypts nemu split packets.
# Its nested stack frames exceed the Zephyr 1024-byte input default.
CONFIG_INPUT_THREAD_STACK_SIZE=2048
