CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_CDC_ACM_DTE_RATE_CALLBACK_SUPPORT=y
CONFIG_ZMK_CDC_ACM_BOOTLOADER_TRIGGER=y
CONFIG_ZMK_CDC_ACM_BOOTLOADER_TRIGGER_DELAY_MS=100

# Dedicated CDC console; Studio keeps its separate RPC interface on Central.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_MODE_OVERFLOW=n
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
# Avoid recursive logging through the USB log transport itself.
CONFIG_USB_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_USB_DRIVER_LOG_LEVEL_OFF=y
